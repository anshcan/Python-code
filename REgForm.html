<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration form</title>
</head>
<body>
    <form method="post">
        <table border="2" align="center" bgcolor="aqua">
            <caption>Registration form</caption>
            <tr>
                <td>First Name</td>
                <td> <input type="text" placeholder="FN"></td>
            </tr>
            <tr>
                <td>Last Name</td>
                <td><input type="text" placeholder="LN"></td>
            </tr>
            <tr>
                <td>Password</td>
                <td><input type="password" placeholder="Pw"></td>
            </tr>
            <tr> 
                <td>Email</td>
                <td><input type="email" placeholder="Email" required></td>
            </tr>
            <tr>
                <td>URL</td>
                <td><input type="url" placeholder="url"></td>
            </tr>
            <tr>
                <td>Address</td>
                <td><textarea rows = "5" cols = "20"placeholder="Permanent Address"></textarea></td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <input type="reset" value="Clear Form">
                    <input type="submit" value="Create Profile">
                </td>
            </tr>
        </table>
        <input type="submit" value="Submit">
    </form>



    
    




</body>
</html>
